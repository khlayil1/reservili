<div class="max-w-4xl mx-auto">
  <div class="flex items-center mb-6">
    <button (click)="onCancel()" class="flex items-center text-sm font-medium text-muted-foreground hover:text-primary transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 me-2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
      </svg>
      {{ 'common.back' | translate }}
    </button>
  </div>

  <div class="bg-card p-8 rounded-xl shadow-md border border-border animate-fade-in-fast">
    <h1 class="text-3xl font-bold text-foreground mb-6">{{ 'userProfile.title' | translate }}</h1>

    @if (editableUser(); as user) {
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- Profile Picture Column -->
        <div class="md:col-span-1 flex flex-col items-center pt-4">
          <label class="block text-sm font-medium text-foreground mb-2">{{ 'userProfile.profilePicture' | translate }}</label>
          <div class="relative group">
            <img [src]="user.imageUrl || 'https://i.pravatar.cc/150?u=default'" [alt]="user.name" class="w-32 h-32 rounded-full object-cover shadow-lg border-4 border-card">
            <button type="button" (click)="onGenerateImage()" class="absolute inset-0 w-full h-full bg-black/50 rounded-full flex items-center justify-center text-white opacity-0 group-hover:opacity-100 transition-opacity">
               <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M5.5 9.5L4 11m0 0a8.953 8.953 0 011.33-4.57M4 11h5m0 0v5m-1.5-1.5L4 11m16 0a8.953 8.953 0 01-1.33 4.57m1.33-4.57h-5m0 0V6m1.5 1.5L20 6" /></svg>
            </button>
          </div>
          <button type="button" (click)="onGenerateImage()" class="mt-4 px-4 py-2 text-xs font-medium text-primary bg-primary/10 rounded-md hover:bg-primary/20">
            {{ user.imageUrl ? ('userProfile.generateNewImage' | translate) : ('userProfile.changeImage' | translate) }}
          </button>
        </div>

        <!-- Form Column -->
        <div class="md:col-span-2">
          <form #profileForm="ngForm" (ngSubmit)="onSaveProfile()" class="space-y-6">
            <div>
              <label for="name" class="block text-sm font-medium text-foreground">{{ 'form.fullName' | translate }}</label>
              <input type="text" id="name" name="name" [(ngModel)]="user.name" required class="mt-1 block w-full px-3 py-2 border border-input bg-background rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-ring">
            </div>
            <div>
              <label for="email" class="block text-sm font-medium text-foreground">{{ 'form.email' | translate }}</label>
              <input type="email" id="email" name="email" [(ngModel)]="user.email" required email class="mt-1 block w-full px-3 py-2 border border-input bg-background rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-ring">
            </div>
             <div>
              <label for="address" class="block text-sm font-medium text-foreground">{{ 'form.address' | translate }}</label>
              <input type="text" id="address" name="address" [(ngModel)]="user.address" class="mt-1 block w-full px-3 py-2 border border-input bg-background rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-ring">
            </div>
             <div>
              <label for="phoneNumber" class="block text-sm font-medium text-foreground">{{ 'form.phoneNumber' | translate }}</label>
              <input type="tel" id="phoneNumber" name="phoneNumber" [(ngModel)]="user.phoneNumber" class="mt-1 block w-full px-3 py-2 border border-input bg-background rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-ring">
            </div>
            <div class="border-t border-border pt-6 flex justify-end gap-3">
              <button type="button" (click)="onCancel()" class="px-4 py-2 text-sm font-medium text-foreground bg-secondary hover:bg-accent rounded-md">{{ 'common.cancel' | translate }}</button>
              <button type="submit" [disabled]="profileForm.invalid" class="px-6 py-2 text-sm font-medium text-primary-foreground bg-primary rounded-md hover:bg-primary/90 disabled:opacity-50">{{ 'common.saveChanges' | translate }}</button>
            </div>
          </form>
        </div>
      </div>
    }
  </div>
</div>
