<div class="flex items-center justify-center min-h-full">
  <div class="w-full max-w-md p-8 space-y-8 bg-card shadow-xl rounded-2xl m-4 border border-border">
    <div class="text-center">
        <div class="flex-shrink-0 flex items-center justify-center gap-2 text-3xl font-bold text-primary">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-9 h-9">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0h18M12 12.75h.008v.008H12v-.008Z" />
          </svg>
          <span>Booky</span>
        </div>
      <h2 class="mt-4 text-2xl font-bold tracking-tight text-foreground">{{ 'login.welcomeBack' | translate }}</h2>
      <p class="mt-2 text-muted-foreground">
        {{ 'login.instructions' | translate }}
      </p>
    </div>
    <form #loginForm="ngForm" (ngSubmit)="onLogin()" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-foreground">{{ 'form.email' | translate }}</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required email placeholder="customer@example.com" class="mt-1 block w-full px-3 py-2 border border-input bg-background rounded-md shadow-sm focus:outline-none focus:ring-ring focus:border-ring">
         <p class="text-xs text-muted-foreground mt-1">Hint: Use `provider@example.com` to log in as a provider.</p>
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-foreground">{{ 'form.password' | translate }}</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required placeholder="********" class="mt-1 block w-full px-3 py-2 border border-input bg-background rounded-md shadow-sm focus:outline-none focus:ring-ring focus:border-ring">
      </div>
      <button type="submit" [disabled]="loginForm.invalid" class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-primary-foreground bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-ring disabled:opacity-50 transition-colors">
        {{ 'login.button' | translate }}
      </button>
    </form>
    <div class="text-center">
      <p class="text-sm text-muted-foreground">
        {{ 'login.noAccount' | translate }}
        <button (click)="onNavigateToRegister()" class="font-medium text-primary hover:text-primary/80">
          {{ 'login.signUp' | translate }}
        </button>
      </p>
    </div>
  </div>
</div>
